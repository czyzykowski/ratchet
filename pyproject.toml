[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ratchet"
version = "0.1.0"
description = "Structured, autonomous AI-driven software development orchestration"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "psycopg[async]>=3.1",
    "psycopg-pool>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "worker*", "tui*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
