[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ratchet"
version = "0.1.0"
description = "Structured, autonomous AI-driven software development orchestration"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "psycopg[async]>=3.1",
    "psycopg-pool>=3.1",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "worker*", "tui*", "web*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["core/tests/", "worker/tests/"]
python_executable = ".venv/bin/python"

[[tool.mypy.overrides]]
module = ["psycopg.*", "psycopg_pool.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
