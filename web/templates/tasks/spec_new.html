{% extends "base.html" %}

{% block title %}Assign Spec — Ratchet{% endblock %}

{% block content %}
<h1>Assign Spec to Task</h1>
<p><a href="/tasks/{{ task.id }}">← Back to task</a></p>

{% if error %}
<p class="warn">{{ error }}</p>
{% endif %}

<form method="post" action="/tasks/{{ task.id }}/spec">
  <p>
    <label for="content">Spec Content</label><br>
    <textarea name="content" id="content" rows="30" cols="100" style="background:#111;color:#e0e0e0;font-family:monospace;border:1px solid #444;padding:0.5rem;width:100%;box-sizing:border-box;"></textarea>
  </p>
  <p><button type="submit" style="background:#2d4a2d;color:#7ec87e;border:1px solid #7ec87e;padding:0.4rem 1rem;cursor:pointer;font-family:monospace;">Assign Spec</button></p>
</form>
{% endblock %}
