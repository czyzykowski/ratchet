<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ratchet{% endblock %}</title>
    <style>
        body { font-family: monospace; margin: 0; padding: 0; background: #1a1a1a; color: #e0e0e0; }
        nav { background: #111; padding: 0.5rem 1rem; border-bottom: 1px solid #333; }
        nav a { color: #7ec8e3; text-decoration: none; margin-right: 1.5rem; }
        nav a:hover { color: #fff; }
        main { padding: 1.5rem; }
        h1 { color: #fff; border-bottom: 1px solid #444; padding-bottom: 0.3rem; }
        h2 { color: #bbb; font-size: 0.95rem; margin-top: 1.5rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
        th { text-align: left; padding: 0.4rem 0.6rem; background: #222; color: #aaa; font-size: 0.85rem; border-bottom: 1px solid #444; }
        td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; }
        tr:hover td { background: #222; }
        a { color: #7ec8e3; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .badge { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.78rem; font-weight: bold; }
        .badge-ready_for_spec { background: #2d4a2d; color: #7ec87e; }
        .badge-spec_qa { background: #4a3d1a; color: #c8a87e; }
        .badge-ready_for_implementation { background: #1a3a4a; color: #7ec8e3; }
        .badge-in_progress { background: #1a2a4a; color: #7ea8e3; }
        .badge-blocked { background: #4a1a1a; color: #e37e7e; }
        .badge-ready_for_qa { background: #3a2a4a; color: #c87ee3; }
        .badge-ready_for_deployment { background: #4a3a1a; color: #e3c87e; }
        .badge-deployed { background: #2d4a3a; color: #7ee3b4; }
        .badge-abandoned { background: #2a2a2a; color: #888; }
        .status-badge { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.78rem; font-weight: bold; }
        .status-compiled { background: #1b3a2d; color: #3fb950; }
        .status-pending  { background: #21262d; color: #8b949e; }
        .warn { color: #e37e7e; font-size: 0.8rem; }
        .meta { color: #888; font-size: 0.85rem; }
        .btn { display: inline-block; padding: 0.2rem 0.6rem; background: #1f3a5f; color: #79c0ff; border-radius: 3px; font-size: 0.8rem; text-decoration: none; }
        .count { color: #888; font-size: 0.85rem; }
        section { margin-bottom: 2rem; }
        dt { color: #aaa; font-size: 0.85rem; margin-top: 0.5rem; }
        dd { margin-left: 1rem; }
        .flash { background: #1f3a1f; color: #7ee37e; border: 1px solid #3a5a3a; padding: 0.4rem 0.8rem; border-radius: 3px; margin-bottom: 1rem; font-size: 0.9rem; }
        input[type=text], textarea { background: #222; color: #e0e0e0; border: 1px solid #444; padding: 0.3rem 0.5rem; border-radius: 3px; font-family: monospace; }
        input[type=submit], button[type=submit] { background: #1f3a5f; color: #79c0ff; border: 1px solid #2a5a8f; padding: 0.3rem 0.8rem; border-radius: 3px; cursor: pointer; font-family: monospace; }
        input[type=submit]:hover, button[type=submit]:hover { background: #2a5a8f; }
        label { color: #aaa; font-size: 0.85rem; }
        .error { color: #e37e7e; font-size: 0.85rem; margin-bottom: 0.5rem; }
        form p { margin: 0.5rem 0; }
        .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; z-index:100; padding:2rem 1rem; }
        .modal { background:#1a1a1a; border:1px solid #444; border-radius:4px; width:100%; max-width:860px; padding:1.5rem; position:relative; }
        .modal-close { position:absolute; top:0.5rem; right:0.8rem; background:none; border:none; color:#aaa; font-size:1.4rem; cursor:pointer; line-height:1; }
        .modal-close:hover { color:#fff; }
        .task-row { cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Board</a>
        <a href="/projects">Projects</a>
        <a href="/projects/new">New Project</a>
        <a href="/features">Features</a>
        <a href="/blocked">Blocked</a>
    </nav>
    <main>
        {% if "session" in request.scope and request.session.get("flash") %}
        <div class="flash">{{ request.session.pop("flash") }}</div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <div id="task-modal-backdrop" class="modal-backdrop" hidden>
        <div id="task-modal" class="modal" role="dialog" aria-modal="true">
            <button id="task-modal-close" class="modal-close">&times;</button>
            <div id="task-modal-body"></div>
        </div>
    </div>
    <script src="/static/modal.js"></script>
</body>
</html>
