{% extends "base.html" %}

{% block title %}New Project — Ratchet{% endblock %}

{% block content %}
<h1>Register Project</h1>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="/projects">
  <p>
    <label for="name">Name</label><br>
    <input type="text" id="name" name="name" required>
  </p>
  <p>
    <label for="path">Path</label><br>
    <input type="text" id="path" name="path" placeholder="Absolute path to local git repo" required style="width: 40rem;">
  </p>
  <p>
    <input type="submit" value="Register Project">
  </p>
</form>
{% endblock %}
